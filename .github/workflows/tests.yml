name: Python tests

on:
  push:
    branches: ["main", "feature/workflow-persistence", "feature/opspilot-workflow-platform"]
  pull_request:
    branches: ["main", "feature/pdf-to-excel-automation"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py modules tests
      - name: Check JavaScript syntax
        run: node --check static/workflow.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
